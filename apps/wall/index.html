  <!-- Firebase 무한로딩 방지 강력한 해결책 -->
  <script>
    // 즉시 오프라인 모드로 설정하여 Firebase 연결 문제 우회
    window.OFFLINE_MODE = true;
    console.log('오프라인 모드로 시작 - Firebase 연결 문제 우회');
    
    // main.js 즉시 로드
    document.addEventListener('DOMContentLoaded', function() {
      const mainScript = document.createElement('script');
      mainScript.type = 'module';
      mainScript.src = './main.js';
      document.head.appendChild(mainScript);
    });
    
    // Firebase 초기화는 선택적으로 시도 (백그라운드)
    setTimeout(() => {
      try {
        const firebaseScript = document.createElement('script');
        firebaseScript.type = 'module';
        firebaseScript.src = './firebase-init.js';
        firebaseScript.onload = () => {
          console.log('Firebase 연결 성공 (백그라운드)');
          window.OFFLINE_MODE = false;
        };
        firebaseScript.onerror = () => {
          console.log('Firebase 연결 실패 - 오프라인 모드 유지');
        };
        document.head.appendChild(firebaseScript);
      } catch (error) {
        console.log('Firebase 초기화 오류 - 오프라인 모드 유지');
      }
    }, 100);
  </script>
  
  <script>
    // 브라우저 기본 스크롤 완전히 비활성화
    document.addEventListener('DOMContentLoaded', function() {
      // 휠 스크롤 방지
      window.addEventListener('wheel', function(e) {
        e.preventDefault();
      }, { passive: false });
      
      // 키보드 스크롤 방지
      window.addEventListener('keydown', function(e) {
        if(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'Home', 'End'].indexOf(e.code) > -1) {
          e.preventDefault();
        }
      }, false);
      
      // 터치 스크롤 방지 (모바일) - 수정: 단일 터치는 허용
      document.addEventListener('touchstart', function(e) {
        if(e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });
      
      // touchmove만 방지하고 touchend는 허용 (클릭을 위해)
      document.addEventListener('touchmove', function(e) {
        // 스크롤만 방지하고 클릭은 허용
        if(e.touches.length === 1) {
          const touch = e.touches[0];
          const canvas = document.querySelector('canvas');
          if(canvas && canvas.contains(e.target)) {
            // 캔버스 내에서만 터치 이동 방지
            e.preventDefault();
          }
        } else {
          e.preventDefault();
        }
      }, { passive: false });
    });
  </script>

      position: fixed;
      top: 30px;
      left: 30px; /* 중앙에서 왼쪽으로 이동 */
      display: flex;
      gap: 20px; /* 간격 증가 */
      z-index: 1000;
    }

    .set-btn {
      background: linear-gradient(145deg, rgba(60, 60, 70, 0.9), rgba(40, 40, 50, 0.9));
      border: 3px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 20px 24px; /* 패딩 증가 */
      border-radius: 30px; /* 둥글기 증가 */
      font-size: 18px; /* 폰트 크기 증가 */
      font-weight: 600;
      text-align: center;
      line-height: 1.1;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      min-width: 120px; /* 최소 너비 증가 */
      backdrop-filter: blur(15px);
      position: relative;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2); /* 그림자 증가 */
    }

    .set-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.6s ease;
    }

    .set-btn:hover::before {
      left: 100%;
    }

    .set-btn .icon {
      font-size: 32px; /* 아이콘 크기 증가 */
      display: block;
      margin-bottom: 6px; /* 여백 증가 */
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
    }

    .set-btn .label {
      font-size: 14px; /* 라벨 크기 증가 */
      opacity: 0.9;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .set-btn:hover {
      transform: translateY(-4px) scale(1.08); /* 호버 효과 증가 */
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); /* 그림자 증가 */
    }

    /* SET별 테마 색상 */
    .set-btn[data-set="set1"] {
      background: linear-gradient(145deg, rgba(0, 120, 255, 0.8), rgba(0, 80, 200, 0.8));
      border-color: rgba(0, 150, 255, 0.3);
    }

    .set-btn[data-set="set1"]:hover {
      background: linear-gradient(145deg, rgba(0, 140, 255, 0.9), rgba(0, 100, 220, 0.9));
      box-shadow: 0 10px 30px rgba(0, 120, 255, 0.4); /* 그림자 증가 */
    }

    .set-btn[data-set="set2"] {
      background: linear-gradient(145deg, rgba(255, 120, 0, 0.8), rgba(220, 80, 0, 0.8));
      border-color: rgba(255, 140, 0, 0.3);
    }

    .set-btn[data-set="set2"]:hover {
      background: linear-gradient(145deg, rgba(255, 140, 0, 0.9), rgba(240, 100, 0, 0.9));
      box-shadow: 0 10px 30px rgba(255, 120, 0, 0.4); /* 그림자 증가 */
    }

    .set-btn[data-set="set3"] {
      background: linear-gradient(145deg, rgba(50, 180, 100, 0.8), rgba(30, 140, 80, 0.8));
      border-color: rgba(70, 200, 120, 0.3);
    }

    .set-btn[data-set="set3"]:hover {
      background: linear-gradient(145deg, rgba(70, 200, 120, 0.9), rgba(50, 160, 100, 0.9));
      box-shadow: 0 10px 30px rgba(50, 180, 100, 0.4); /* 그림자 증가 */
    }

    .set-btn[data-set="set4"] {
      background: linear-gradient(145deg, rgba(180, 50, 150, 0.8), rgba(140, 30, 120, 0.8));
      border-color: rgba(200, 70, 170, 0.3);
    }

    .set-btn[data-set="set4"]:hover {
      background: linear-gradient(145deg, rgba(200, 70, 170, 0.9), rgba(160, 50, 140, 0.9));
      box-shadow: 0 10px 30px rgba(180, 50, 150, 0.4); /* 그림자 증가 */
    }

    .set-btn[data-set="set5"] {
      background: linear-gradient(145deg, rgba(255, 200, 0, 0.8), rgba(200, 150, 0, 0.8));
      border-color: rgba(255, 220, 0, 0.3);
    }

    .set-btn[data-set="set5"]:hover {
      background: linear-gradient(145deg, rgba(255, 220, 0, 0.9), rgba(220, 170, 0, 0.9));
      box-shadow: 0 10px 30px rgba(255, 200, 0, 0.4); /* 그림자 증가 */
    }

    .set-btn.active {
      transform: translateY(-3px) scale(1.12); /* 활성 상태 효과 증가 */
      border-width: 4px;
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.3), inset 0 2px 10px rgba(255, 255, 255, 0.2); /* 그림자 증가 */
    }

    .set-btn.active[data-set="set1"] {
      border-color: rgba(0, 200, 255, 0.8);
      box-shadow: 0 0 30px rgba(0, 150, 255, 0.6), inset 0 2px 10px rgba(255, 255, 255, 0.2);
    }

    .set-btn.active[data-set="set2"] {
      border-color: rgba(255, 180, 0, 0.8);
      box-shadow: 0 0 30px rgba(255, 140, 0, 0.6), inset 0 2px 10px rgba(255, 255, 255, 0.2);
    }

    .set-btn.active[data-set="set3"] {
      border-color: rgba(100, 220, 140, 0.8);
      box-shadow: 0 0 30px rgba(70, 200, 120, 0.6), inset 0 2px 10px rgba(255, 255, 255, 0.2);
    }

    .set-btn.active[data-set="set4"] {
      border-color: rgba(220, 100, 190, 0.8);
      box-shadow: 0 0 30px rgba(200, 70, 170, 0.6), inset 0 2px 10px rgba(255, 255, 255, 0.2);
    }

    .set-btn.active[data-set="set5"] {
      border-color: rgba(255, 240, 0, 0.8);
      box-shadow: 0 0 30px rgba(255, 220, 0, 0.6), inset 0 2px 10px rgba(255, 255, 255, 0.2);
    }
  </style>
</head>

<body>
  <!-- 팬 UI - 브라우저 창 상단 고정 -->
  <div id="panUI" class="pan-ui">
    🖐️ 화면 이동 중
  </div>
  
  <!-- 필터 상태 UI - 화면 상단 중앙 -->
  <div id="filterStatusUI" class="filter-status-ui">
    🔍 필터 적용 중
  </div>
  
  <!-- 카메라 디버그 정보 - 전시용으로 숨김 -->
  <div id="cameraDebug" class="camera-debug" style="display: none;">
    카메라: (0, 0)
  </div>

  <!-- 세트 공간 이동 버튼들 -->
  <div class="set-navigation">
    <button class="set-btn active" data-set="set1">
      <div class="icon">🎮</div>
      <div class="label">게임/디지털</div>
    </button>
    <button class="set-btn" data-set="set2">
      <div class="icon">⚡</div>
      <div class="label">활동/에너지</div>
    </button>
    <button class="set-btn" data-set="set3">
      <div class="icon">💚</div>
      <div class="label">기억/성장</div>
    </button>
    <button class="set-btn" data-set="set4">
      <div class="icon">🎭</div>
      <div class="label">감성/문화</div>
    </button>
    <button class="set-btn" data-set="set5">
      <div class="icon">🎨</div>
      <div class="label">창작/계절</div>
    </button>
  </div>

  <!-- 상단 오른쪽 버튼들 -->
  <div class="top-buttons-container">
    <!-- 무대 리셋 버튼 (오른쪽 끝) -->
    <button id="resetStageBtn" class="reset-stage-btn">
      🎭 무대 리셋
    </button>
    
    <!-- 아바타 정렬 버튼 (리셋 버튼 왼쪽) -->
    <button id="sortAvatarsBtn" class="sort-avatars-btn">
      📐 아바타 정렬
    </button>
    
    <!-- 개발자용 스테이지 아바타 토글 버튼 (패드 시스템으로 대체) -->
    <button id="toggleStageAvatarsBtn" class="toggle-stage-avatars-btn" style="display: none;">
      🔧 스테이지 아바타 ON/OFF (비활성화됨)
    </button>
    
    <!-- TODO: 추가 버튼들을 여기에 추가 가능 -->
  </div>

  <!-- 필터링 UI (오른쪽 버튼들 아래) -->
  <div class="filter-container">
    <!-- 필터 토글 버튼 -->
    <button class="filter-toggle-btn" id="filterToggleBtn">
      🔍 아바타 필터링 <span id="filterToggleIcon">▶</span>
    </button>
    
    <!-- 접을 수 있는 필터 내용 -->
    <div class="filter-content collapsed" id="filterContent">
    
    <div class="filter-group">
      <label class="filter-label">조합법 (추억 종류)</label>
      <select class="filter-select" id="categoryFilter">
        <option value="all">전체 보기</option>
        <option value="PC방과 온라인 게임">🎮 PC방과 온라인 게임</option>
        <option value="집에서 게임기로">🏠 집에서 게임기로</option>
        <option value="SNS 속 디지털 추억">📱 SNS 속 디지털 추억</option>
        <option value="운동과 스포츠">🏃‍♂️ 운동과 스포츠</option>
        <option value="축제와 이벤트">🎪 축제와 이벤트</option>
        <option value="여행지에서의 특별한 경험">✈️ 여행지에서의 특별한 경험</option>
        <option value="가족과의 따뜻한 시간">👨‍👩‍👧‍👦 가족과의 따뜻한 시간</option>
        <option value="학창시절 추억">🎓 학창시절 추억</option>
        <option value="봄의 따뜻한 추억">🌸 봄의 따뜻한 추억</option>
        <option value="그리운 옛날 생각">💭 그리운 옛날 생각</option>
        <option value="밤과 새벽">🌙 밤과 새벽</option>
        <option value="드라마, 영화, 웹툰과 함께">� 드라마, 영화, 웹툰과 함께</option>
        <option value="미술과 창작활동">🎨 미술과 창작활동</option>
        <option value="감성적인 가을의 추억">🍂 감성적인 가을의 추억</option>
        <option value="포근한 겨울의 추억">❄️ 포근한 겨울의 추억</option>
      </select>
    </div>

    <!-- 음악 세트 필터 - 세트별 공간 분리로 인해 비활성화 -->
    <div class="filter-group" style="display: none;">
      <label class="filter-label">음악 세트 (BPM)</label>
      <select class="filter-select" id="musicSetFilter">
        <option value="all">전체 보기</option>
        <option value="set1">SET1 - 게임/디지털 (170 BPM)</option>
        <option value="set2">SET2 - 활동/에너지 (170 BPM)</option>
        <option value="set3">SET3 - 기억/성장 (140 BPM)</option>
        <option value="set4">SET4 - 감성/문화 (140 BPM)</option>
        <option value="set5">SET5 - 창작/계절 (130 BPM)</option>
      </select>
    </div>

    <div class="filter-group">
      <label class="filter-label">음악 파트 (포지션)</label>
      <select class="filter-select" id="positionFilter">
        <option value="all">전체 보기</option>
        <option value="bass">베이스 (Bass)</option>
        <option value="drum">드럼 (Drum)</option>
        <option value="chord">코드 (Chord)</option>
        <option value="lead">리드 (Lead)</option>
        <option value="fx">효과음 (FX)</option>
        <option value="sub">서브 (Sub)</option>
      </select>
    </div>

    <div class="filter-buttons">
      <button class="filter-btn filter-reset-btn" id="resetFilterBtn">초기화</button>
    </div>

    <div class="filter-stats" id="filterStats">
      전체 아바타 보기 중
    </div>
    </div> <!-- filter-content 닫기 -->
  </div>

  <!-- 서류철 스타일 악기 패드 시스템 -->
  <div id="instrumentPadContainer" class="pad-container">
    <!-- 탭 버튼 -->
    <button id="padToggleBtn" class="pad-tab">♪ 악기 추가</button>
    
    <!-- 패드 패널 -->
    <div id="instrumentPadPanel" class="pad-panel">
      <div class="pad-header">
        <h3>악기 선택 패드</h3>
        <p>현재 세트: <span id="currentSetName">SET1 - 게임/디지털</span></p>
      </div>
      
      <div class="recipe-grid">
        <!-- 조합법 1 -->
        <div class="recipe-section">
          <h4 id="recipe1Name">조합법 1</h4>
          <div class="instrument-buttons">
            <button class="instrument-btn bass-btn" data-instrument="bass" data-recipe="1">🎵</button>
            <button class="instrument-btn drum-btn" data-instrument="drum" data-recipe="1">🥁</button>
            <button class="instrument-btn lead-btn" data-instrument="lead" data-recipe="1">🎸</button>
            <button class="instrument-btn chord-btn" data-instrument="chord" data-recipe="1">🎹</button>
            <button class="instrument-btn sub-btn" data-instrument="sub" data-recipe="1">🎺</button>
            <button class="instrument-btn fx-btn" data-instrument="fx" data-recipe="1">🔊</button>
          </div>
        </div>
        
        <!-- 조합법 2 -->
        <div class="recipe-section">
          <h4 id="recipe2Name">조합법 2</h4>
          <div class="instrument-buttons">
            <button class="instrument-btn bass-btn" data-instrument="bass" data-recipe="2">🎵</button>
            <button class="instrument-btn drum-btn" data-instrument="drum" data-recipe="2">🥁</button>
            <button class="instrument-btn lead-btn" data-instrument="lead" data-recipe="2">🎸</button>
            <button class="instrument-btn chord-btn" data-instrument="chord" data-recipe="2">🎹</button>
            <button class="instrument-btn sub-btn" data-instrument="sub" data-recipe="2">🎺</button>
            <button class="instrument-btn fx-btn" data-instrument="fx" data-recipe="2">🔊</button>
          </div>
        </div>
        
        <!-- 조합법 3 -->
        <div class="recipe-section">
          <h4 id="recipe3Name">조합법 3</h4>
          <div class="instrument-buttons">
            <button class="instrument-btn bass-btn" data-instrument="bass" data-recipe="3">🎵</button>
            <button class="instrument-btn drum-btn" data-instrument="drum" data-recipe="3">🥁</button>
            <button class="instrument-btn lead-btn" data-instrument="lead" data-recipe="3">🎸</button>
            <button class="instrument-btn chord-btn" data-instrument="chord" data-recipe="3">🎹</button>
            <button class="instrument-btn sub-btn" data-instrument="sub" data-recipe="3">🎺</button>
            <button class="instrument-btn fx-btn" data-instrument="fx" data-recipe="3">🔊</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 팝업 오버레이 -->
  <div id="popupOverlay" class="popup-overlay">
    <div class="popup-content">
      <button class="popup-close" onclick="closePopup()">×</button>
      <div class="avatar-info">
        <img id="popupAvatarImage" class="avatar-image" src="avatar_sample.jpeg" alt="아바타">
        <div class="avatar-details">
          <h3>아바타 정보</h3>
          <div class="nickname-row">
            <span class="nickname-text"><span id="popupNickname">-</span></span>
            <div class="keywords-container" id="popupKeywords">
              <!-- 키워드 태그들이 여기에 동적으로 추가됩니다 -->
            </div>
          </div>
          <div class="music-info">
            <span id="popupMusicPosition">-</span> | <span id="popupSelectedRecipe">-</span>
          </div>
          <div class="memory-text" id="popupMemory">-</div>
        </div>
      </div>
      <div class="help-text">
        이 아바타를 드래그해서 원하는 위치로 이동시킬 수 있습니다.<br>
        팝업 외부를 클릭하거나 × 버튼을 눌러 닫을 수 있습니다.
      </div>
    </div>
  </div>
</body>

</html>
