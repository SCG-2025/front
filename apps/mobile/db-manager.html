<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데이터베이스 관리 - 전시 준비</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .info-box {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            border-left: 5px solid #ffd700;
        }
        .warning-box {
            background: rgba(255, 100, 100, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            border-left: 5px solid #ff4444;
        }
        .success-box {
            background: rgba(100, 255, 100, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            border-left: 5px solid #44ff44;
            display: none;
        }
        .avatar-list {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            max-height: 500px;
            overflow-y: auto;
            display: none;
        }
        .avatar-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            border-left: 4px solid #74b9ff;
        }
        .avatar-item h4 {
            margin: 0 0 10px 0;
            color: #ffd700;
        }
        .avatar-item p {
            margin: 5px 0;
            font-size: 14px;
        }
        .avatar-item .memory-text {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-style: italic;
            max-height: 100px;
            overflow-y: auto;
        }
        .avatar-item .delete-btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
            float: right;
        }
        .avatar-item .delete-btn:hover {
            background: linear-gradient(45deg, #e55656, #d63031);
            transform: translateY(-1px);
        }
        .avatar-item .delete-btn:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }
        .bulk-delete-controls {
            background: rgba(255, 100, 100, 0.2);
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            text-align: center;
            display: none;
        }
        .checkbox-container {
            display: inline-block;
            margin-right: 10px;
        }
        .checkbox-container input[type="checkbox"] {
            margin-right: 5px;
        }
        .avatar-preview {
            width: 120px;
            height: 120px;
            float: left;
            margin-right: 15px;
            margin-bottom: 10px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
        }
        .avatar-info {
            margin-left: 140px;
        }
        .customize-info {
            background: rgba(255,255,255,0.15);
            border-radius: 8px;
            padding: 10px;
            margin: 10px 0;
            font-size: 0.9em;
        }
        button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px 5px;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-secondary {
            background: linear-gradient(45deg, #74b9ff, #0984e3);
            box-shadow: 0 4px 15px rgba(116, 185, 255, 0.4);
        }
        .btn-secondary:hover {
            box-shadow: 0 6px 20px rgba(116, 185, 255, 0.6);
        }
        #status {
            font-size: 16px;
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>🎭 전시 준비 - DB 관리</h1>
        
        <div class="info-box">
            <h3>📊 현재 상태</h3>
            <p>데이터베이스: <strong>scg2025-2e856</strong></p>
            <p>컬렉션: <strong>memories</strong></p>
            <p id="docCount">문서 개수: 확인 중...</p>
        </div>

        <div class="warning-box">
            <h3>⚠️ 주의사항</h3>
            <p><strong>이 작업은 되돌릴 수 없습니다!</strong></p>
            <p>모든 아바타 데이터가 영구적으로 삭제됩니다.</p>
            <p>전시 준비를 위해 깨끗한 상태로 시작하려면 진행하세요.</p>
        </div>

        <div class="success-box" id="successBox">
            <h3>✅ 삭제 완료!</h3>
            <p>모든 아바타 데이터가 성공적으로 삭제되었습니다.</p>
            <p>이제 전시를 위한 새로운 데이터를 받을 준비가 되었습니다.</p>
        </div>

        <div class="avatar-list" id="avatarList">
            <h3>👥 아바타 목록</h3>
            
            <div class="bulk-delete-controls" id="bulkDeleteControls">
                <h4>🗑️ 선택 삭제</h4>
                <p>삭제할 아바타들을 선택하고 아래 버튼을 클릭하세요.</p>
                <button onclick="selectAllAvatars()" class="btn-secondary" style="margin: 5px;">✅ 전체 선택</button>
                <button onclick="deselectAllAvatars()" class="btn-secondary" style="margin: 5px;">❌ 선택 해제</button>
                <button onclick="deleteSelectedAvatars()" style="margin: 5px;" id="deleteSelectedBtn" disabled>
                    🗑️ 선택된 아바타 삭제 (<span id="selectedCount">0</span>개)
                </button>
            </div>
            
            <div id="avatarContainer">
                <!-- 아바타 정보들이 여기에 표시됩니다 -->
            </div>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <button id="checkBtn" class="btn-secondary" onclick="checkDocuments()">
                📋 문서 개수 확인
            </button>
            <button id="viewBtn" class="btn-secondary" onclick="viewAvatars()">
                👥 아바타 목록 보기
            </button>
            <button id="deleteBtn" onclick="deleteAllDocuments()" disabled>
                🗑️ 모든 데이터 삭제
            </button>
        </div>

        <div id="status"></div>
    </div>

    <script type="module">
        import { db } from './firebase-init.js';
        import { 
            collection, 
            getDocs, 
            deleteDoc, 
            doc 
        } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js';

        let totalDocs = 0;
        let avatarsData = [];
        let selectedAvatars = new Set();

        window.checkDocuments = async function() {
            const checkBtn = document.getElementById('checkBtn');
            const deleteBtn = document.getElementById('deleteBtn');
            const status = document.getElementById('status');
            const docCount = document.getElementById('docCount');
            
            checkBtn.disabled = true;
            checkBtn.innerHTML = '<span class="loading"></span>확인 중...';
            
            try {
                const snapshot = await getDocs(collection(db, 'memories'));
                totalDocs = snapshot.size;
                
                // 아바타 데이터 저장
                avatarsData = [];
                snapshot.forEach((doc) => {
                    avatarsData.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });
                
                docCount.textContent = `문서 개수: ${totalDocs}개`;
                
                if (totalDocs > 0) {
                    status.innerHTML = `
                        <strong>📋 발견된 문서: ${totalDocs}개</strong><br>
                        삭제 버튼이 활성화되었습니다.
                    `;
                    deleteBtn.disabled = false;
                } else {
                    status.innerHTML = `
                        <strong>📭 데이터베이스가 이미 비어있습니다.</strong><br>
                        삭제할 문서가 없습니다.
                    `;
                }
                
                checkBtn.innerHTML = '📋 문서 개수 확인';
                checkBtn.disabled = false;
                
            } catch (error) {
                console.error('문서 확인 오류:', error);
                status.innerHTML = `
                    <strong style="color: #ff6b6b;">❌ 오류 발생:</strong><br>
                    ${error.message}
                `;
                checkBtn.innerHTML = '📋 문서 개수 확인';
                checkBtn.disabled = false;
            }
        }

        window.viewAvatars = async function() {
            const viewBtn = document.getElementById('viewBtn');
            const avatarList = document.getElementById('avatarList');
            const avatarContainer = document.getElementById('avatarContainer');
            
            if (avatarList.style.display === 'block') {
                // 목록 숨기기
                avatarList.style.display = 'none';
                viewBtn.innerHTML = '👥 아바타 목록 보기';
                return;
            }
            
            viewBtn.disabled = true;
            viewBtn.innerHTML = '<span class="loading"></span>로딩 중...';
            
            try {
                if (avatarsData.length === 0) {
                    // 데이터가 없으면 다시 가져오기
                    await checkDocuments();
                }
                
                if (avatarsData.length === 0) {
                    avatarContainer.innerHTML = `
                        <div class="avatar-item">
                            <p><strong>📭 아바타 데이터가 없습니다.</strong></p>
                            <p>아직 아무도 추억을 작성하지 않았거나 모든 데이터가 삭제되었습니다.</p>
                        </div>
                    `;
                } else {
                    let avatarHTML = '';
                    
                    avatarsData.forEach((avatar, index) => {
                        const nickname = avatar.nickname || '이름 없음';
                        const memory = avatar.memory || '추억 내용 없음';
                        const category = avatar.category || (avatar.selectedRecipe ? avatar.selectedRecipe.name : '카테고리 없음');
                        const timestamp = avatar.timestamp ? new Date(avatar.timestamp.seconds * 1000).toLocaleString('ko-KR') : '시간 정보 없음';
                        const keywords = avatar.keywords ? avatar.keywords.join(', ') : '키워드 없음';
                        
                        // 아바타 커스터마이징 정보 추출
                        const avatarData = avatar.avatar || {};
                        const gender = avatarData.gender || 'female';
                        const bodyIdx = avatarData.bodyIdx || 0;
                        const headIdx = avatarData.headIdx;
                        const sopumOn = avatarData.sopumOn || false;
                        const sopumIdx = avatarData.sopumIdx;
                        const musicPosition = avatar.musicPosition || '알 수 없음';
                        
                        // 커스터마이징 정보 텍스트
                        const customizeInfo = `
                            <div class="customize-info">
                                <strong>🎨 아바타 커스터마이징:</strong><br>
                                성별: ${gender === 'female' ? '여성' : '남성'}<br>
                                바디: ${gender}-${bodyIdx + 1}<br>
                                헤드: ${headIdx !== null ? `head-${headIdx + 1}` : '없음'}<br>
                                소품: ${sopumOn ? `sopum-${sopumIdx + 1}` : '없음'}<br>
                                음악 포지션: ${musicPosition}
                            </div>
                        `;
                        
                        avatarHTML += `
                            <div class="avatar-item" id="avatar-${avatar.id}">
                                <canvas class="avatar-preview" id="canvas-${avatar.id}" width="120" height="120"></canvas>
                                <div class="avatar-info">
                                    <div class="checkbox-container">
                                        <input type="checkbox" id="check-${avatar.id}" onchange="updateSelectedCount()">
                                        <label for="check-${avatar.id}">선택</label>
                                    </div>
                                    <button class="delete-btn" onclick="deleteSingleAvatar('${avatar.id}', '${nickname.replace(/'/g, "\\'")}')">🗑️ 삭제</button>
                                    <h4>🎭 ${nickname} (${index + 1}번)</h4>
                                    <p><strong>📁 카테고리:</strong> ${category}</p>
                                    <p><strong>🏷️ 키워드:</strong> ${keywords}</p>
                                    <p><strong>⏰ 작성 시간:</strong> ${timestamp}</p>
                                    <p><strong>📄 문서 ID:</strong> ${avatar.id}</p>
                                    ${customizeInfo}
                                    <div class="memory-text">
                                        <strong>💭 추억 내용:</strong><br>
                                        ${memory.replace(/\n/g, '<br>')}
                                    </div>
                                    <div style="clear: both;"></div>
                                </div>
                            </div>
                        `;
                    });
                    
                    avatarContainer.innerHTML = avatarHTML;
                    
                    // 아바타 렌더링 관련 변수들
        let avatarAssets = { female: [], male: [], heads: [], sopum: [] };
        let assetsLoaded = false;
        
        // 아바타 에셋 로드 함수
        async function loadAvatarAssets() {
            if (assetsLoaded) return;
            
            try {
                // Female avatars
                avatarAssets.female.push(loadImage('assets/fe.png'));
                for (let i = 2; i <= 7; i++) {
                    avatarAssets.female.push(loadImage(`assets/fe(${i}).png`));
                }
                
                // Male avatars
                avatarAssets.male.push(loadImage('assets/ma.png'));
                for (let i = 2; i <= 9; i++) {
                    avatarAssets.male.push(loadImage(`assets/ma(${i}).png`));
                }
                
                // Head accessories
                const headFiles = [
                    'assets/head.png',
                    'assets/head(2).png',
                    'assets/head(3).png',
                    'assets/head(4).png',
                    'assets/head(5).png',
                    'assets/head(6).png',
                    'assets/head(7).png',
                    'assets/head(8).png',
                    'assets/head(9).PNG',
                    'assets/head(10).PNG',
                    'assets/head(11).PNG'
                ];
                headFiles.forEach(file => {
                    avatarAssets.heads.push(loadImage(file));
                });
                
                // Sopum accessories
                const sopumFiles = [
                    'assets/sopum.png',
                    'assets/sopum(2).PNG',
                    'assets/sopum(3).PNG',
                    'assets/sopum(4).PNG',
                    'assets/sopum(5).PNG',
                    'assets/sopum(6).PNG',
                    'assets/sopum(7).PNG',
                    'assets/sopum(8).PNG',
                    'assets/sopum(9).png',
                    'assets/sopum(10).PNG',
                    'assets/sopum(11).png'
                ];
                sopumFiles.forEach(file => {
                    avatarAssets.sopum.push(loadImage(file));
                });
                
                assetsLoaded = true;
                console.log('✅ 아바타 에셋 로드 완료');
            } catch (error) {
                console.error('❌ 아바타 에셋 로드 실패:', error);
            }
        }
        
        // 개별 오프셋 설정 (mobile과 동일)
        const HEAD_INDIVIDUAL_OFFSETS = {
            8: {
                female: { x: 8, y: -20, s: 220 },
                male: { x: 8, y: -21, s: 220 }
            }
        };
        
        const SOPUM_INDIVIDUAL_OFFSETS = {
            8: {
                female: { x: 40, y: 70, s: 60 },
                male: { x: 40, y: 70, s: 60 }
            },
            9: {
                female: { x: 5, y: -15, s: 180 },
                male: { x: 5, y: -25, s: 180 }
            },
            10: {
                female: { x: 0, y: -20, s: 250 },
                male: { x: 0, y: -25, s: 250 }
            }
        };
        
        // 캔버스에 아바타 렌더링
        function renderAvatarOnCanvas(avatarData, canvasId) {
            const canvas = document.getElementById(canvasId);
            if (!canvas || !assetsLoaded) {
                setTimeout(() => renderAvatarOnCanvas(avatarData, canvasId), 100);
                return;
            }
            
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 120, 120);
            
            const centerX = 60;
            const centerY = 60;
            const scaleFactor = 0.25; // 작은 프리뷰용 스케일
            const baseSize = 200 * scaleFactor;
            
            // 기본 오프셋
            const OFFSETS = {
                body: { s: baseSize },
                sopum: {
                    female: { x: -58 * scaleFactor, y: 43 * scaleFactor, s: 60 * scaleFactor },
                    male: { x: -4 * scaleFactor, y: -8 * scaleFactor, s: baseSize }
                },
                head: {
                    female: { x: 0, y: -15 * scaleFactor, s: baseSize },
                    male: { x: 0, y: -16 * scaleFactor, s: baseSize }
                }
            };
            
            // Body variant offset
            const BODY_VARIANT_OFFSET = {
                female: { 0: { x: 0, y: 0 }, 1: { x: 2, y: -2 }, 2: { x: 1, y: 0 }, 3: { x: -1, y: 0 }, 4: { x: 0, y: 2 }, 5: { x: 1, y: 1 }, 6: { x: -1, y: 1 } },
                male: { 0: { x: 0, y: 0 }, 1: { x: 1, y: -2 }, 2: { x: 2, y: 0 }, 3: { x: 0, y: 0 }, 4: { x: 1, y: 1 }, 5: { x: -1, y: 0 }, 6: { x: 0, y: -1 }, 7: { x: 1, y: 0 }, 8: { x: -2, y: 1 } }
            };
            
            const bodyPool = avatarData.gender === 'female' ? avatarAssets.female : avatarAssets.male;
            const bodyImg = bodyPool && bodyPool[avatarData.bodyIdx || 0];
            const vOff = BODY_VARIANT_OFFSET[avatarData.gender]?.[avatarData.bodyIdx || 0] || { x: 0, y: 0 };
            const scaledVOff = { x: vOff.x * scaleFactor, y: vOff.y * scaleFactor };
            
            ctx.save();
            ctx.translate(centerX, centerY);
            
            // 1. 날개 먼저 (뒤쪽)
            if (avatarData.sopumOn && avatarData.sopumIdx === 10 && avatarAssets.sopum && avatarAssets.sopum[10] && avatarAssets.sopum[10].complete) {
                const w = {
                    x: SOPUM_INDIVIDUAL_OFFSETS[10][avatarData.gender].x * scaleFactor,
                    y: SOPUM_INDIVIDUAL_OFFSETS[10][avatarData.gender].y * scaleFactor,
                    s: SOPUM_INDIVIDUAL_OFFSETS[10][avatarData.gender].s * scaleFactor
                };
                ctx.drawImage(avatarAssets.sopum[10], 
                    w.x + scaledVOff.x - w.s/2, w.y + scaledVOff.y - w.s/2, w.s, w.s);
            }
            
            // 2. Body
            if (bodyImg && bodyImg.complete) {
                ctx.drawImage(bodyImg, 
                    scaledVOff.x - baseSize/2, scaledVOff.y - baseSize/2, baseSize, baseSize);
            } else {
                // 폴백
                ctx.fillStyle = '#ffdbac';
                ctx.fillRect(scaledVOff.x - 25, scaledVOff.y - 30, 50, 60);
            }
            
            // 3. Head
            if (avatarData.headIdx !== null && avatarData.headIdx !== undefined && 
                avatarAssets.heads && avatarAssets.heads[avatarData.headIdx] && avatarAssets.heads[avatarData.headIdx].complete) {
                
                const headImg = avatarAssets.heads[avatarData.headIdx];
                const individualOffset = HEAD_INDIVIDUAL_OFFSETS[avatarData.headIdx];
                
                if (individualOffset && individualOffset[avatarData.gender]) {
                    const h = {
                        x: individualOffset[avatarData.gender].x * scaleFactor,
                        y: individualOffset[avatarData.gender].y * scaleFactor,
                        s: individualOffset[avatarData.gender].s * scaleFactor
                    };
                    ctx.drawImage(headImg, 
                        h.x + scaledVOff.x - h.s/2, h.y + scaledVOff.y - h.s/2, h.s, h.s);
                } else {
                    const h = OFFSETS.head[avatarData.gender];
                    ctx.drawImage(headImg, 
                        h.x + scaledVOff.x - h.s/2, h.y + scaledVOff.y - h.s/2, h.s, h.s);
                }
            }
            
            // 4. 다른 sopum들 (날개 제외)
            if (avatarData.sopumOn && avatarData.sopumIdx !== 10 && typeof avatarData.sopumIdx === 'number' && 
                avatarAssets.sopum && avatarAssets.sopum[avatarData.sopumIdx] && avatarAssets.sopum[avatarData.sopumIdx].complete) {
                
                const sopumImg = avatarAssets.sopum[avatarData.sopumIdx];
                const individualOffset = SOPUM_INDIVIDUAL_OFFSETS[avatarData.sopumIdx];
                
                if (individualOffset && individualOffset[avatarData.gender]) {
                    const w = {
                        x: individualOffset[avatarData.gender].x * scaleFactor,
                        y: individualOffset[avatarData.gender].y * scaleFactor,
                        s: individualOffset[avatarData.gender].s * scaleFactor
                    };
                    ctx.drawImage(sopumImg, 
                        w.x + scaledVOff.x - w.s/2, w.y + scaledVOff.y - w.s/2, w.s, w.s);
                } else {
                    const w = OFFSETS.sopum[avatarData.gender];
                    let extraOffsetX = 0;
                    if (avatarData.sopumIdx <= 7) {
                        extraOffsetX = 15 * scaleFactor;
                    }
                    ctx.drawImage(sopumImg, 
                        w.x + scaledVOff.x + extraOffsetX - w.s/2, w.y + scaledVOff.y - w.s/2, w.s, w.s);
                }
            }
            
            ctx.restore();
        }
        
        // 아바타 이미지 렌더링
                    if (!assetsLoaded) {
                        await loadAvatarAssets();
                        // 에셋 로드 완료 대기
                        setTimeout(() => {
                            avatarsData.forEach((avatar, index) => {
                                renderAvatarOnCanvas(avatar.avatar || {}, `canvas-${avatar.id}`);
                            });
                        }, 500);
                    } else {
                        setTimeout(() => {
                            avatarsData.forEach((avatar, index) => {
                                renderAvatarOnCanvas(avatar.avatar || {}, `canvas-${avatar.id}`);
                            });
                        }, 100);
                    }
                    
                    // 대량 삭제 컨트롤 표시
                    document.getElementById('bulkDeleteControls').style.display = 'block';
                }
                
                avatarList.style.display = 'block';
                viewBtn.innerHTML = '🙈 목록 숨기기';
                viewBtn.disabled = false;
                
                // 스크롤을 아바타 목록으로 이동
                avatarList.scrollIntoView({ behavior: 'smooth' });
                
            } catch (error) {
                console.error('아바타 목록 로딩 오류:', error);
                avatarContainer.innerHTML = `
                    <div class="avatar-item">
                        <p><strong style="color: #ff6b6b;">❌ 오류 발생:</strong></p>
                        <p>${error.message}</p>
                    </div>
                `;
                avatarList.style.display = 'block';
                viewBtn.innerHTML = '👥 아바타 목록 보기';
                viewBtn.disabled = false;
            }
        }

        // 개별 아바타 삭제
        window.deleteSingleAvatar = async function(avatarId, avatarName) {
            if (!confirm(`"${avatarName}" 아바타를 삭제하시겠습니까?\n\n이 작업은 되돌릴 수 없습니다.`)) {
                return;
            }

            const avatarElement = document.getElementById(`avatar-${avatarId}`);
            const deleteBtn = avatarElement.querySelector('.delete-btn');
            
            deleteBtn.disabled = true;
            deleteBtn.innerHTML = '<span class="loading"></span>삭제 중...';
            
            try {
                await deleteDoc(doc(db, 'memories', avatarId));
                
                // UI에서 제거
                avatarElement.style.opacity = '0.5';
                avatarElement.style.transform = 'scale(0.9)';
                
                setTimeout(() => {
                    avatarElement.remove();
                    
                    // 데이터 배열에서도 제거
                    avatarsData = avatarsData.filter(avatar => avatar.id !== avatarId);
                    selectedAvatars.delete(avatarId);
                    
                    // 문서 개수 업데이트
                    totalDocs = avatarsData.length;
                    document.getElementById('docCount').textContent = `문서 개수: ${totalDocs}개`;
                    
                    updateSelectedCount();
                    
                    if (avatarsData.length === 0) {
                        document.getElementById('avatarContainer').innerHTML = `
                            <div class="avatar-item">
                                <p><strong>📭 모든 아바타가 삭제되었습니다.</strong></p>
                                <p>더 이상 표시할 아바타가 없습니다.</p>
                            </div>
                        `;
                        document.getElementById('bulkDeleteControls').style.display = 'none';
                    }
                }, 300);
                
            } catch (error) {
                console.error('개별 삭제 오류:', error);
                alert(`삭제 중 오류가 발생했습니다: ${error.message}`);
                deleteBtn.disabled = false;
                deleteBtn.innerHTML = '🗑️ 삭제';
            }
        }

        // 선택된 개수 업데이트
        window.updateSelectedCount = function() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"][id^="check-"]');
            selectedAvatars.clear();
            
            checkboxes.forEach(checkbox => {
                if (checkbox.checked) {
                    const avatarId = checkbox.id.replace('check-', '');
                    selectedAvatars.add(avatarId);
                }
            });
            
            document.getElementById('selectedCount').textContent = selectedAvatars.size;
            document.getElementById('deleteSelectedBtn').disabled = selectedAvatars.size === 0;
        }

        // 전체 선택
        window.selectAllAvatars = function() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"][id^="check-"]');
            checkboxes.forEach(checkbox => {
                checkbox.checked = true;
            });
            updateSelectedCount();
        }

        // 선택 해제
        window.deselectAllAvatars = function() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"][id^="check-"]');
            checkboxes.forEach(checkbox => {
                checkbox.checked = false;
            });
            updateSelectedCount();
        }

        // 선택된 아바타들 삭제
        window.deleteSelectedAvatars = async function() {
            if (selectedAvatars.size === 0) {
                alert('삭제할 아바타를 선택해주세요.');
                return;
            }

            const selectedNames = Array.from(selectedAvatars).map(id => {
                const avatar = avatarsData.find(a => a.id === id);
                return avatar ? avatar.nickname || '이름 없음' : id;
            });

            if (!confirm(`선택된 ${selectedAvatars.size}개의 아바타를 삭제하시겠습니까?\n\n삭제될 아바타:\n${selectedNames.join(', ')}\n\n이 작업은 되돌릴 수 없습니다.`)) {
                return;
            }

            const deleteBtn = document.getElementById('deleteSelectedBtn');
            deleteBtn.disabled = true;
            deleteBtn.innerHTML = '<span class="loading"></span>삭제 중...';

            try {
                const deletePromises = [];
                let deletedCount = 0;
                const totalToDelete = selectedAvatars.size;

                for (const avatarId of selectedAvatars) {
                    const deletePromise = deleteDoc(doc(db, 'memories', avatarId))
                        .then(() => {
                            deletedCount++;
                            deleteBtn.innerHTML = `<span class="loading"></span>삭제 중... (${deletedCount}/${totalToDelete})`;
                        });
                    deletePromises.push(deletePromise);
                }

                await Promise.all(deletePromises);

                // UI에서 선택된 아바타들 제거
                selectedAvatars.forEach(avatarId => {
                    const element = document.getElementById(`avatar-${avatarId}`);
                    if (element) {
                        element.style.opacity = '0.5';
                        element.style.transform = 'scale(0.9)';
                        setTimeout(() => element.remove(), 300);
                    }
                });

                // 데이터 배열에서 제거
                avatarsData = avatarsData.filter(avatar => !selectedAvatars.has(avatar.id));
                selectedAvatars.clear();

                // 문서 개수 업데이트
                totalDocs = avatarsData.length;
                document.getElementById('docCount').textContent = `문서 개수: ${totalDocs}개`;

                setTimeout(() => {
                    updateSelectedCount();
                    
                    if (avatarsData.length === 0) {
                        document.getElementById('avatarContainer').innerHTML = `
                            <div class="avatar-item">
                                <p><strong>📭 모든 아바타가 삭제되었습니다.</strong></p>
                                <p>더 이상 표시할 아바타가 없습니다.</p>
                            </div>
                        `;
                        document.getElementById('bulkDeleteControls').style.display = 'none';
                    }
                }, 500);

                deleteBtn.innerHTML = `🗑️ 선택된 아바타 삭제 (0개)`;
                deleteBtn.disabled = true;

            } catch (error) {
                console.error('선택 삭제 오류:', error);
                alert(`삭제 중 오류가 발생했습니다: ${error.message}`);
                deleteBtn.innerHTML = `🗑️ 선택된 아바타 삭제 (${selectedAvatars.size}개)`;
                deleteBtn.disabled = false;
            }
        }

        window.deleteAllDocuments = async function() {
            if (!confirm(`정말로 모든 ${totalDocs}개의 아바타 데이터를 삭제하시겠습니까?\n\n이 작업은 되돌릴 수 없습니다!`)) {
                return;
            }

            if (!confirm('마지막 확인입니다.\n\n전시 준비를 위해 모든 데이터를 삭제하시겠습니까?')) {
                return;
            }

            const deleteBtn = document.getElementById('deleteBtn');
            const status = document.getElementById('status');
            const successBox = document.getElementById('successBox');
            
            deleteBtn.disabled = true;
            deleteBtn.innerHTML = '<span class="loading"></span>삭제 중...';
            
            try {
                const snapshot = await getDocs(collection(db, 'memories'));
                const deletePromises = [];
                let deletedCount = 0;
                
                status.innerHTML = `<span class="loading"></span>삭제 진행 중... (0/${snapshot.size})`;
                
                snapshot.forEach((docSnapshot) => {
                    const deletePromise = deleteDoc(doc(db, 'memories', docSnapshot.id))
                        .then(() => {
                            deletedCount++;
                            status.innerHTML = `<span class="loading"></span>삭제 진행 중... (${deletedCount}/${snapshot.size})`;
                        });
                    deletePromises.push(deletePromise);
                });
                
                await Promise.all(deletePromises);
                
                status.innerHTML = `
                    <strong style="color: #44ff44;">✅ 삭제 완료!</strong><br>
                    총 ${deletedCount}개의 문서가 삭제되었습니다.
                `;
                
                successBox.style.display = 'block';
                
                // 문서 개수 다시 확인
                setTimeout(() => {
                    checkDocuments();
                }, 1000);
                
            } catch (error) {
                console.error('삭제 오류:', error);
                status.innerHTML = `
                    <strong style="color: #ff6b6b;">❌ 삭제 중 오류 발생:</strong><br>
                    ${error.message}
                `;
                deleteBtn.disabled = false;
                deleteBtn.innerHTML = '🗑️ 모든 데이터 삭제';
            }
        }

        // 아바타 렌더링 함수
        window.renderAvatarOnCanvas = function(avatarData, canvasId) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 120, 120);
            
            // 기본 배경
            ctx.fillStyle = '#f0f0f0';
            ctx.fillRect(0, 0, 120, 120);
            
            // 아바타 정보 텍스트로 표시
            ctx.fillStyle = '#333';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            
            const gender = avatarData.gender || 'female';
            const bodyIdx = avatarData.bodyIdx || 0;
            const headIdx = avatarData.headIdx;
            const sopumOn = avatarData.sopumOn || false;
            
            // 성별 표시
            ctx.fillText(gender === 'female' ? '👩' : '👨', 60, 25);
            
            // 바디 정보
            ctx.font = '10px sans-serif';
            ctx.fillText(`바디: ${gender}-${bodyIdx + 1}`, 60, 45);
            
            // 헤드 정보
            if (headIdx !== null && headIdx !== undefined) {
                ctx.fillText(`헤드: head-${headIdx + 1}`, 60, 60);
            } else {
                ctx.fillText('헤드: 없음', 60, 60);
            }
            
            // 소품 정보
            if (sopumOn && avatarData.sopumIdx !== undefined) {
                ctx.fillText(`소품: sopum-${avatarData.sopumIdx + 1}`, 60, 75);
            } else {
                ctx.fillText('소품: 없음', 60, 75);
            }
            
            // 음악 포지션 (부모 데이터에서)
            ctx.fillText('🎵 ' + (avatarData.musicPosition || '알수없음'), 60, 95);
            
            // 테두리
            ctx.strokeStyle = '#ccc';
            ctx.lineWidth = 1;
            ctx.strokeRect(0, 0, 120, 120);
        }

        // 페이지 로드시 자동으로 문서 개수 확인
        window.addEventListener('load', () => {
            setTimeout(checkDocuments, 1000);
        });
    </script>
</body>
</html>
