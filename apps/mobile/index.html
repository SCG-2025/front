<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>추억 시작 화면</title>
  <!-- 픽셀 폰트 예시: Google Fonts 'Press Start 2P' 사용 -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    /* 1. 전체 화면 및 기본 스타일 */
    html,
    body {
      height: 100vh; /* 정확한 뇠이트 높이 */
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      overflow: hidden; /* 모든 스크롤 완전 차단 */
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      /* 배경 이미지 설정 - 모바일 최적화 */
      background-color: #f5f5f5; /* fallback 배경색 */
      background: url('bg_sample.jpg') no-repeat center center;
      background-size: cover; /* 화면을 가득 채우면서 비율 유지 */
      background-attachment: scroll; /* iOS Safari 호환성을 위해 scroll로 변경 */
      overflow: hidden; /* 모든 스크롤 차단 */
      position: relative;
    }

    /* 2. 로고 스타일 */
    .logo {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 120px;
      height: auto;
      z-index: 10;
    }

    /* 3. 상단 문구 스타일 */
    .title {
      font-family: 'Press Start 2P', cursive;
      position: absolute;
      /* 추가 */
      top: 40%;
      /* 로고 아래로 이동 */
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.8rem;
      font-weight: bold;
      text-align: center;
      color: #333;
      line-height: 1.3;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      /* 하얀 테두리 효과 */
      text-shadow:
        -2px -2px 0 #fff,
        2px -2px 0 #fff,
        -2px 2px 0 #fff,
        2px 2px 0 #fff;
    }

    /* 3. 중앙 버튼 영역 스타일 */
    .center-btn {
      position: absolute;
      left: 50%;
      bottom: 20%;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    /* 4. 플레이 버튼 스타일 */
    .play-btn {
      width: 160px;
      height: 160px;
      background: #4a90e2;
      border-radius: 16px;
      /* 원형 대신 픽셀 느낌의 둥근 사각형 */
      font-family: 'Press Start 2P', cursive;
      /* 픽셀 폰트 적용 */
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 0 8px #fff, 0 8px 0 0 #222;
      /* 픽셀 그림자 효과 */
      border: 4px solid #222;
      /* 픽셀 테두리 */
      cursor: pointer;
      outline: none;
      transition: background 0.2s;
    }

    .play-btn:active {
      background: #357ab8;
      transform: scale(0.96);
      box-shadow: 0 0 0 4px #fff, 0 4px 0 0 #222;
    }

    /* 5. 플레이 아이콘 스타일 */
    .play-icon {
      width: 64px;
      height: 64px;
      fill: #fff;
    }

    /* 모바일에서 스크롤 완전 방지 및 배경 최적화 */
    @media (hover: none) and (pointer: coarse) {
      html, body {
        position: fixed; /* 모바일에서 스크롤 완전 차단 */
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      /* iOS Safari에서 주소창 변화 대응 */
      body {
        height: 100vh;
        height: -webkit-fill-available; /* iOS Safari 지원 */
        /* 모바일에서 배경 이미지 처리 강화 */
        background-attachment: scroll; /* iOS Safari 호환성 */
        background-size: cover;
        background-position: center center;
      }
    }

    /* iOS Safari 전용 높이 처리 */
    @supports (-webkit-touch-callout: none) {
      body {
        height: -webkit-fill-available;
        /* iOS Safari 배경 이미지 문제 해결 */
        background-attachment: scroll;
      }
    }

    /* 안드로이드 크롬 뷰포트 높이 문제 해결 */
    @media screen and (max-width: 768px) {
      body {
        min-height: 100vh;
        min-height: 100dvh; /* 동적 뷰포트 높이 지원 */
        background-attachment: scroll;
        background-size: cover;
      }
    }
  </style>
</head>

<body>
  <!-- 1. 로고 -->
  <img src="logo.png" alt="로고" class="logo">
  <!-- 2. 상단 문구 -->
  <div class="title">What does your memory look like?</div>
  <!-- 3. 중앙 버튼 영역 -->
  <div class="center-btn">
    <!-- 4. 플레이 버튼 (클릭 시 다음 페이지 이동) -->
    <button class="play-btn" onclick="location.href='write.html'">
      <!-- 5. 플레이 아이콘 (SVG) -->
      <svg class="play-icon" viewBox="0 0 32 32">
        <polygon points="10,6 26,16 10,26" />
      </svg>
    </button>
  </div>
