<!DOCTYPE html>
<html>

<head>
    <title>Video Player</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            overflow: hidden;
        }

        video {
            width: 100vw;
            height: 100vh;
            display: none;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>
    <!-- 비디오 루프 끊김 방지: preload="auto" 추가, 여러 포맷 지원 -->
    <video id="avatarVideo" muted loop playsinline style="display: none;" preload="auto"></video>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const videoPlayer = document.getElementById('avatarVideo');

        // 캔버스 크기 설정
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 비디오 샘플
        const videoSamples = {
            'pcroom_gaming': 'Media/video1.mp4',
            'home_console_gaming': 'Media/video2.mp4',
            'social_media_memories': 'Media/video3.mp4',
            'sports_activities': 'Media/video4.mp4',
            'festivals_events': 'Media/video5.mp4',
            'travel_places': 'Media/video6.mp4',
            'family_warmth': 'Media/video7.mp4',
            'school_memories': 'Media/video8.mp4',
            'spring_memories': 'Media/video9.mp4',
            'nostalgia_longing': 'Media/video10.mp4',
            'night_dawn': 'Media/video11.mp4',
            'entertainment_culture': 'Media/video12.mp4',
            'art_creative': 'Media/video13.mp4',
            'autumn_memories': 'Media/video14.mp4',
            'winter_memories': 'Media/video15.mp4'
        };

        // 포지션 매핑 (main.js의 getImageNumberFromPosition과 동일하게)
        const posMap = {
            'Lead': 1,
            '리드멜로디': 1,
            'Sub': 2,
            '서브멜로디': 2,
            'Chord': 3,
            'Chords': 3,
            '코드': 3,
            'Bass': 4,
            '베이스': 4,
            'Drum': 5,
            'Drums': 5,
            'Drum_Bass': 5,
            'Drum_Chords': 5,
            'Drum_FX': 5,
            'Drum_Lead': 5,
            'Drum_Sub': 5,
            '드럼/퍼커션': 5,
            'FX': 6,
            'Chord_FX': 6,
            '효과음/FX': 6
        };

        // 상태 변수
        let floatingImages = [];
        let currentImageNum = 0;
        let isVideoPlaying = false;
        let showFloatingImages = false;
        let displayMode = 'none'; // 'image', 'video', 'countdown', 'none'
        let countdownTimer = 0;
        let countdownValue = 0;

        // 떠다니는 이미지 생성 클래스 (작은 이미지들)
        class FloatingImage {
            constructor(x, y, imageNum) {
                this.x = x;
                this.y = y;
                this.imageNum = imageNum;
                this.vx = (Math.random() - 0.5) * 4;  // 좌우 속도
                this.vy = (Math.random() - 0.5) * 4;  // 상하 속도
                this.size = 200 + Math.random() * 150; // 크기
                this.opacity = 0.6 + Math.random() * 0.4;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.08;
                this.image = null;
                this.loaded = false;
                this.alpha = 0.3; // 시작 투명도
                // 생명시간 관련 변수들 제거 (더 이상 사용하지 않음)
                this.loadImage();
            }

            loadImage() {
                this.image = new Image();
                this.image.src = `Img/${this.imageNum}.png`;
                this.image.onload = () => {
                    this.loaded = true;
                };
                this.image.onerror = () => {
                    console.warn(`이미지 로드 실패: Img/${this.imageNum}.png`);
                };
            }

            update() {
                // 위치 업데이트
                this.x += this.vx;
                this.y += this.vy;

                // 창 경계에서 튕겨나오기 (벽 충돌)
                if (this.x <= this.size/2 || this.x >= canvas.width - this.size/2) {
                    this.vx = -this.vx; // X축 속도 반전
                    this.x = Math.max(this.size/2, Math.min(canvas.width - this.size/2, this.x));
                }
                
                if (this.y <= this.size/2 || this.y >= canvas.height - this.size/2) {
                    this.vy = -this.vy; // Y축 속도 반전
                    this.y = Math.max(this.size/2, Math.min(canvas.height - this.size/2, this.y));
                }

                // 회전 업데이트
                this.rotation += this.rotationSpeed;
                
                // 생명시간 제거 - 이제 계속 살아있음
                // this.lifeCounter--;

                // 리스폰 제거 - 더 이상 가운데에서 리스폰하지 않음
                // if (this.lifeCounter <= 0) {
                //     this.respawn();
                // }

                // 투명도는 항상 최대로 유지
                this.alpha = Math.min(1, this.alpha + 0.02);
            }

            draw(ctx) {
                if (!this.loaded || this.alpha <= 0) return;

                ctx.save();
                ctx.globalAlpha = this.alpha * this.opacity;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.drawImage(this.image, -this.size / 2, -this.size / 2, this.size, this.size);
                ctx.restore();
            }

            isAlive() {
                // 이제 이미지들은 계속 살아있음 (창 경계에서 튕겨나오므로)
                return true;
            }
        }

        // 떠다니는 이미지를 기존 배열에 추가 (새로 생성하지 않음)
        function addFloatingImages(count = 8, imageNum = null) {
            const targetImageNum = imageNum || currentImageNum;
            for (let i = 0; i < count; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const img = new FloatingImage(x, y, targetImageNum);
                floatingImages.push(img);
            }
        }

        // 애니메이션 루프
        function animate() {
            // 기본적으로 캔버스는 투명하게 클리어
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (displayMode === 'image') {
                // 이미지 모드: 약간의 배경과 떠다니는 이미지들 렌더링
                ctx.fillStyle = 'rgba(0,0,0,0.08)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // 이제 이미지들이 죽지 않으므로 필터링 불필요
                // floatingImages = floatingImages.filter(img => img.isAlive());

                floatingImages.forEach(img => {
                    img.update();
                    img.draw(ctx);
                });

                // 이미지 개수 유지 로직도 수정 - 너무 많아지지 않도록
                if (floatingImages.length < 8) {
                    addFloatingImages(1); // 더 적게 추가
                }
            } else if (displayMode === 'video') {
                // 비디오 프레임을 그리되, 비디오가 준비되지 않았으면 투명 배경 유지
                if (!videoPlayer.paused && videoPlayer.readyState === videoPlayer.HAVE_ENOUGH_DATA) {
                    ctx.drawImage(videoPlayer, 0, 0, canvas.width, canvas.height);
                } else {
                    // 비디오 로드 중에는 약한 배경을 유지
                    ctx.fillStyle = 'rgba(0,0,0,0.04)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
            } else if (displayMode === 'countdown') {
                // 카운트다운 표시
                ctx.fillStyle = '#ff6b6b';
                ctx.font = 'bold 120px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(countdownValue, canvas.width / 2, canvas.height / 2);

                // 배경 효과
                ctx.fillStyle = 'rgba(255, 107, 107, 0.08)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // 하단 메시지
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 32px Arial';
                ctx.fillText('6개 포지션 완성! 비디오 재생 준비 중...', canvas.width / 2, canvas.height / 2 + 100);
            } else {
                // 'none' 모드: 완전 클리어 (검은 화면이 되지 않음)
                // 캔버스를 비워두어 뒤의 페이지 스타일이 보이도록 함
            }

            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('message', (event) => {
            console.log('📬 메시지 수신:', event.data.type, '- 현재 displayMode:', displayMode);
            const { type, payload, position, bpm, imageNumbers, countdown, keepExisting } = event.data;

            if (type === 'SHOW_IMAGE') {
                console.log('🖼️ 이미지 표시 명령 받음:', payload.nickname, payload.musicPosition);
                showFloatingImageSequence(payload, position, bpm);
            } else if (type === 'SHOW_IMAGES') {
                // 비디오 재생 중이면 새로운 이미지 명령 무시
                if (displayMode === 'video') {
                    console.log('🎬 비디오 재생 중 - 이미지 명령 무시:', imageNumbers);
                    return;
                }
                console.log('🖼️ 다중 이미지 표시 명령 받음:', imageNumbers, keepExisting ? '(기존 유지)' : '(새로 시작)');
                showMultipleImages(imageNumbers, keepExisting);
            } else if (type === 'START_COUNTDOWN') {
                console.log('⏰ 카운트다운 시작:', countdown);
                startCountdown(countdown);
            } else if (type === 'PLAY_VIDEO') {
                console.log('🎬 PLAY_VIDEO 메시지 수신:', event.data);
                if (payload && payload.nickname) {
                    // 개별 아바타 비디오 재생
                    console.log('🎬 개별 비디오 재생 명령 받음:', payload.nickname, payload.musicType);
                    playVideo(payload, position, bpm);
                } else if (event.data.positions && Array.isArray(event.data.positions)) {
                    // 6개 포지션 완성 비디오 재생
                    const musicSet = event.data.musicSet || 'pcroom_gaming';
                    console.log(`🎬 6개 포지션 완성 비디오 재생! 조합법: ${musicSet}, 포지션:`, event.data.positions);
                    playCompletionVideo(musicSet);
                } else {
                    console.log('🎬 기본 6개 포지션 완성 비디오 재생');
                    playCompletionVideo();
                }
            } else if (type === 'STOP_VIDEO' || type === 'RESET_STAGE') {
                console.log('⏹️ 비디오 정지 명령 받음');
                videoPlayer.pause();
                videoPlayer.src = "";
                displayMode = 'none';
                floatingImages = []; // 모든 떠다니는 이미지 제거
                currentImageNum = 0;
                countdownValue = 0;
                console.log('✨ 모든 이미지가 제거되었습니다.');
            } else if (type === 'REMOVE_IMAGES') {
                // 특정 포지션 이미지 제거
                if (event.data.imageNumbers && Array.isArray(event.data.imageNumbers)) {
                    event.data.imageNumbers.forEach(imageNum => {
                        removeImagesForPosition(imageNum);
                    });
                } else {
                    clearAllImages();
                }
            } else if (type === 'CLEAR_ALL_IMAGES') {
                console.log('🔧 메시지 받음: 모든 이미지 강제 제거');
                clearAllImages();
                // 메인 창에 처리 완료 응답
                if (event.source) {
                    event.source.postMessage({type: 'CLEAR_COMPLETE'}, '*');
                }
            } else if (type === 'RESET_STAGE') {
                console.log('🔄 메시지 받음: 스테이지 리셋');
                clearAllImages();
                // 추가 리셋 로직
                displayMode = 'none';
                floatingImages = [];
                // 메인 창에 처리 완료 응답
                if (event.source) {
                    event.source.postMessage({type: 'RESET_COMPLETE'}, '*');
                }
            }
        });

        function playVideo(avatar, startTime = 0, masterBpm = 140) {
            // avatar.musicType에서 실제 음악 세트 키를 추출
            // 예: "set1_pcroom_gaming_bass.wav" -> "pcroom_gaming"
            let musicSetKey = avatar.musicType;

            // .wav 확장자 제거
            if (musicSetKey.endsWith('.wav')) {
                musicSetKey = musicSetKey.replace('.wav', '');
            }

            // "set1_" 같은 접두사 제거
            musicSetKey = musicSetKey.replace(/^set\d+_/, '');

            // "_bass", "_lead" 등 포지션 접미사 제거
            musicSetKey = musicSetKey.replace(/_bass$/, '')
                .replace(/_lead$/, '')
                .replace(/_sub$/, '')
                .replace(/_chord$/, '')
                .replace(/_drum$/, '')
                .replace(/_fx$/, '')
                .replace(/_chords$/, '');

            const videoSrc = videoSamples[musicSetKey];

            console.log(`🎬 playVideo 호출됨:`);
            console.log(`   - avatar.nickname: ${avatar.nickname}`);
            console.log(`   - avatar.musicType (원본): ${avatar.musicType}`);
            console.log(`   - 추출된 musicSetKey: ${musicSetKey}`);
            console.log(`   - videoSamples[${musicSetKey}]: ${videoSrc}`);

            if (!videoSrc) {
                console.warn(`⚠️ 비디오 소스를 찾을 수 없음: ${avatar.musicType} (추출된 키: ${musicSetKey})`);
                console.warn(`사용 가능한 비디오 키:`, Object.keys(videoSamples));
                return;
            }

            console.log(`🎬 비디오 재생: ${videoSrc}`);

            // 같은 비디오 재생 중이면 건너뛰기 (루프 끊김 방지)
            if (videoPlayer.src === videoSrc && !videoPlayer.paused) {
                console.log(`ℹ️ 이미 재생 중인 비디오: ${videoSrc}`);
                return;
            }

            // 새로운 비디오 설정
            videoPlayer.src = videoSrc;

            // 메타데이터 로드 후 재생
            const playVideo = () => {
                videoPlayer.currentTime = startTime;

                const originalBpm = 140;
                const effectiveBpm = masterBpm || originalBpm;
                videoPlayer.playbackRate = effectiveBpm / originalBpm;

                videoPlayer.play().catch(e => {
                    console.error('비디오 재생 실패:', e);
                });
            };

            // 비디오가 이미 로드되었으면 바로 재생
            if (videoPlayer.readyState >= videoPlayer.HAVE_FUTURE_DATA) {
                playVideo();
            } else {
                // 로드 대기
                videoPlayer.addEventListener('canplay', playVideo, { once: true });
            }

            displayMode = 'video';
        }

        // 아바타별로 이미지만 띄우는 함수 - 페이지 전체에 표시
        function showFloatingImageSequence(avatar, startTime = 0, masterBpm = 140) {
            let positionNum = currentImageNum;
            if (avatar.musicPosition) {
                positionNum = posMap[avatar.musicPosition] || currentImageNum;
            }

            console.log(`🖼️ 이미지 시퀀스: 포지션=${avatar.musicPosition} -> 숫자=${positionNum}`);

            currentImageNum = positionNum;

            // 기존 이미지 유지하면서 새 이미지 추가
            addFloatingImages(12);

            displayMode = 'image';

            console.log(`✅ 이미지 표시 시작: ${avatar.nickname}`);
        }

        // 다중 포지션 이미지 표시 (리스폰 순환 시스템)
        function showMultipleImages(imageNumbers, keepExisting = false) {
            console.log(`🖼️ showMultipleImages 호출: imageNumbers=[${imageNumbers.join(',')}], keepExisting=${keepExisting}`);
            
            // keepExisting가 false면 기존 이미지 완전 초기화
            if (!keepExisting) {
                console.log('🗑️ 기존 이미지 모두 제거');
                floatingImages = [];
            }
            
            // 각 이미지 번호에 대해 기존 이미지가 있는지 확인
            imageNumbers.forEach(imageNum => {
                const existingImages = floatingImages.filter(img => img.imageNum === imageNum);
                
                if (existingImages.length === 0) {
                    // 새로운 포지션 - 8개 생성
                    console.log(`➕ 이미지 ${imageNum} - 8개 새로 생성`);
                    for (let i = 0; i < 8; i++) {
                        const x = Math.random() * canvas.width;
                        const y = Math.random() * canvas.height;
                        const img = new FloatingImage(x, y, imageNum);
                        floatingImages.push(img);
                    }
                } else {
                    console.log(`♾️ 이미지 ${imageNum} - 기존 ${existingImages.length}개 유지`);
                }
            });
            
            displayMode = 'image';
            const totalCount = floatingImages.length;
            console.log(`✅ 다중 이미지 완료: [포지션: ${imageNumbers.join(',')}] ${keepExisting ? '누적모드' : '새시작'} (총 ${totalCount}개)`);
        }

        // 카운트다운 시작
        function startCountdown(seconds) {
            countdownValue = seconds;
            displayMode = 'countdown';
            
            const timer = setInterval(() => {
                countdownValue--;
                if (countdownValue <= 0) {
                    clearInterval(timer);
                    displayMode = 'none';
                }
            }, 1000);
        }

        // 6개 포지션 완성 시 재생할 비디오 (musicSet에 따라 다른 비디오 선택)
        function playCompletionVideo(musicSet = 'pcroom_gaming') {
            // musicSet에 맞는 비디오 선택
            const videoSrc = videoSamples[musicSet] || videoSamples['pcroom_gaming'];
            console.log(`🎬 musicSet "${musicSet}"에 맞는 비디오: ${videoSrc}`);
            
            videoPlayer.src = videoSrc;
            videoPlayer.currentTime = 0;
            videoPlayer.playbackRate = 1;
            
            videoPlayer.play().then(() => {
                displayMode = 'video';
                console.log(`🎆 ${musicSet} 조합법 완성 비디오 재생 시작! (${videoSrc})`);
                // main.js에 비디오 재생 상태 알림
                window.parent.postMessage({type: 'VIDEO_STARTED', musicSet: musicSet}, '*');
            }).catch(e => {
                console.error(`${musicSet} 비디오 재생 실패:`, e);
                // 실패 시 기본 비디오로 대체
                if (musicSet !== 'pcroom_gaming') {
                    console.log('기본 PC방 비디오로 대체 시도...');
                    playCompletionVideo('pcroom_gaming');
                }
            });
        }

        // 특정 포지션의 이미지들을 제거
        function removeImagesForPosition(imageNumber) {
            console.log(`🗑️ 포지션 ${imageNumber} 이미지 제거 시작`);
            const initialCount = floatingImages.length;
            
            // 해당 이미지 번호의 모든 이미지 제거
            floatingImages = floatingImages.filter(img => img.imageNum !== imageNumber);
            
            const removedCount = initialCount - floatingImages.length;
            console.log(`✅ 포지션 ${imageNumber} 이미지 ${removedCount}개 제거 완료 (${floatingImages.length}개 남음)`);
            
            // 남은 이미지가 없으면 빈 화면
            if (floatingImages.length === 0) {
                displayMode = 'none';
                console.log('🌃 모든 이미지 제거됨 - 빈 화면으로 전환');
            }
        }

        // 전체 이미지 제거 (강제 동기화)
        function clearAllImages() {
            console.log('🗑️ 모든 이미지 강제 제거 시작');
            floatingImages = [];
            displayMode = 'none';
            currentImageNum = 0;
            
            // 투명한 배경으로 화면 클리어 (검은색 대신)
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 강제 렌더링 트리거
            requestAnimationFrame(() => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            });
            
            console.log('✅ 모든 이미지 제거 완료 - displayMode: none, 투명 배경 적용');
        }
        function stopImageDisplay() {
            displayMode = 'none';
            floatingImages = [];
            console.log('⏹️ 이미지 표시 종료');
        }

        // 외부에서 호출 가능하도록 전역 함수로 등록
        window.stopImageDisplay = stopImageDisplay;
    </script>
</body>

</html>
