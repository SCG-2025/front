<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>아바타 만들기</title>

    <!-- p5.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>

    <!-- 최소한의 전역 스타일 -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 배경 고정을 위한 가상 요소 사용 (모바일 호환성) */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('bg_sample2.jpg') no-repeat center center;
            background-size: cover;
            z-index: -1;
        }

        html {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: sans-serif;
            color: #222;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
            position: relative;
        }

        /* p5 캔버스가 화면 너비에 맞게 줄어들도록 */
        canvas {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            background: transparent;
        }

        /* 모든 UI 요소들이 배경 위에 오도록 */
        #cat-bar, #inventory, .button {
            position: relative;
            z-index: 2;
        }

        /* 가로 스크롤 최적화 */
        #inventory {
            scrollbar-width: thin; /* Firefox */
            scrollbar-color: #ccc transparent; /* Firefox */
        }

        /* 웹킷 기반 브라우저 스크롤바 */
        #inventory::-webkit-scrollbar {
            height: 6px;
        }

        #inventory::-webkit-scrollbar-track {
            background: transparent;
        }

        #inventory::-webkit-scrollbar-thumb {
            background-color: #ccc;
            border-radius: 3px;
        }

        #inventory::-webkit-scrollbar-thumb:hover {
            background-color: #999;
        }

        /* 터치 디바이스 최적화 */
        @media (hover: none) and (pointer: coarse) {
            #inventory {
                scrollbar-width: none; /* 모바일에서는 스크롤바 숨김 */
            }
            
            #inventory::-webkit-scrollbar {
                display: none; /* 모바일에서는 스크롤바 숨김 */
            }
        }
    </style>
</head>

<body>
    <!-- Firebase 무한로딩 방지 -->
    <script>
        window.OFFLINE_MODE = true;
        console.log('커스터마이징 페이지 오프라인 모드로 시작');
        
        // customizing.js 즉시 로드
        document.addEventListener('DOMContentLoaded', function() {
            const script = document.createElement('script');
            script.type = 'module';
            script.src = './customizing.js';
            document.head.appendChild(script);
        });
        
        // Firebase는 백그라운드에서 선택적으로 로드
        setTimeout(() => {
            try {
                const firebaseScript = document.createElement('script');
                firebaseScript.type = 'module';
                firebaseScript.src = 'firebase-init.js';
                firebaseScript.onload = () => {
                    console.log('Firebase 연결 성공 (백그라운드)');
                    window.OFFLINE_MODE = false;
                };
                firebaseScript.onerror = () => {
                    console.log('Firebase 연결 실패 - 오프라인 모드 유지');
                };
                document.head.appendChild(firebaseScript);
            } catch (error) {
                console.log('Firebase 초기화 오류 - 오프라인 모드 유지');
            }
        }, 100);
    </script>
</body>

</html>
